<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Professional CV</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ececec;
padding:40px;
}

.cv{

width:210mm;
min-height:297mm;

background:white;

margin:auto;

display:flex;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}

.left{

width:34%;

background:#16365c;

color:white;

padding:35px;

}

.right{

width:66%;

padding:40px;

}

.photo{

width:150px;

height:150px;

border-radius:50%;

overflow:hidden;

margin:auto;

margin-bottom:20px;

border:5px solid white;

}

.photo img{

width:100%;

height:100%;

object-fit:cover;

}

.name{

font-size:32px;

font-weight:bold;

text-align:center;

margin-bottom:8px;

}

.job{

text-align:center;

font-size:18px;

margin-bottom:35px;

color:#d8e8ff;

}

.section{

margin-bottom:28px;

}

.section h2{

font-size:19px;

margin-bottom:10px;

border-bottom:2px solid rgba(255,255,255,.4);

padding-bottom:6px;

}

.right .section h2{

color:#16365c;

border-bottom:2px solid #16365c;

}

.item{

margin-bottom:12px;

font-size:14px;

line-height:24px;

}

</style>

</head>

<body>

<div class="cv">

<div class="left">

<div class="photo">

<img src="{{PHOTO_URL}}">

</div>

<div class="name">{{FULL_NAME}}</div>

<div class="job">{{PROFESSION}}</div>

<div class="section">

<h2>CONTACT</h2>

<div class="item">{{PHONE}}</div>

<div class="item">{{EMAIL}}</div>

<div class="item">{{COUNTRY}}</div>

</div>

<div class="section">

<h2>LANGUAGES</h2>

<div class="item">{{LANGUAGES}}</div>

</div>

<div class="section">

<h2>SKILLS</h2>

<div class="item">{{SKILLS}}</div>

</div>

</div>

<div class="right">

<div class="section">

<h2>PROFILE</h2>

<p>{{PROFILE}}</p>

</div>

<div class="section">

<h2>WORK EXPERIENCE</h2>

{{EXPERIENCE}}

</div>

<div class="section">

<h2>EDUCATION</h2>

{{EDUCATION}}

</div>

</div>

</div>

</body>

</html>
