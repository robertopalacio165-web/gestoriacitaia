<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Taj"; src: url("../fonts/Tajawal-Black.ttf"); }
  @font-face { font-family: "TajX"; src: url("../fonts/Tajawal-ExtraBold.ttf"); }
  @font-face { font-family: "Mont"; src: url("../fonts/Montserrat-Black.ttf"); }
  @font-face { font-family: "Anton"; src: url("../fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Bold.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .ar { font-family: "Taj", "Inter", sans-serif; direction: rtl; }
  .abs { position: absolute; }
  .center-x { left: 50%; transform: translateX(-50%); }
  .gold { background: linear-gradient(180deg, #FFF3C4 0%, #F6C453 38%, #C8901C 62%, #FFE08A 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 6px 0 rgba(0,0,0,.55)) drop-shadow(0 14px 22px rgba(0,0,0,.45)); }
  .glass { background: rgba(12,12,14,.78); border: 2px solid rgba(255,255,255,.12); border-radius: 34px;
           box-shadow: 0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
</style>
<script src="../vendor/gsap.min.js"></script>
</head><body><div id="stage"></div>
<script>
/* Each template builds DOM inside #stage and returns a PAUSED gsap timeline.
   The renderer seeks the timeline frame by frame (deterministic, no real-time playback). */
const S = () => document.getElementById("stage");
const el = (tag, cls, html, css) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (html != null) e.innerHTML = html; if (css) Object.assign(e.style, css); S().appendChild(e); return e; };

const T = {
  // big number counting up (e.g. discount), Arabic label, gold gradient, light sweep, sparkles
  price_counter(p, D) {
    const y = (p.y ?? 0.16) * 1920;
    const box = el("div", "abs glass", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", padding: "34px 70px 40px",
                  textAlign: "center", minWidth: "640px" });
    const lab = document.createElement("div"); lab.className = "ar"; lab.textContent = p.label || "";
    Object.assign(lab.style, { color: "#fff", fontSize: "72px", lineHeight: "1.1" }); box.appendChild(lab);
    const num = document.createElement("div"); num.className = "gold";
    Object.assign(num.style, { fontFamily: "Mont", fontSize: (p.size || 190) + "px", lineHeight: "1", letterSpacing: "-4px", position: "relative" });
    box.appendChild(num);
    const sweep = document.createElement("div");
    Object.assign(sweep.style, { position: "absolute", top: 0, bottom: 0, width: "160px", left: "-200px",
      background: "linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent)", mixBlendMode: "overlay" });
    box.style.overflow = "hidden"; box.appendChild(sweep);
    const o = { v: p.from ?? 0 }; const fmt = v => (p.prefix || "") + Math.round(v).toLocaleString("en-US") + (p.suffix ?? "€");
    num.textContent = fmt(o.v);
    const tl = gsap.timeline({ paused: true });
    tl.from(box, { duration: .45, y: -60, scale: .7, opacity: 0, ease: "back.out(2)" })
      .from(lab, { duration: .35, y: 30, opacity: 0, ease: "power3.out" }, .15)
      .to(o, { duration: p.count || 1.3, v: p.value, ease: "power2.out", onUpdate: () => num.textContent = fmt(o.v) }, .25)
      .fromTo(num, { scale: 1 }, { duration: .18, scale: 1.12, yoyo: true, repeat: 1, ease: "power2.out" }, .25 + (p.count || 1.3))
      .to(sweep, { duration: .7, left: "120%", ease: "power2.inOut" }, .3 + (p.count || 1.3))
      .to(box, { duration: .3, y: -40, opacity: 0, ease: "power2.in" }, D - .3);
    return tl;
  },
  // name tag: accent bar grows, name slides out of it, role underneath
  lower_third(p, D) {
    const y = (p.y ?? 0.62) * 1920, rtl = /[؀-ۿ]/.test(p.name || "");
    const wrap = el("div", "abs", null, { top: y + "px", [rtl ? "right" : "left"]: "70px", display: "flex",
                   flexDirection: rtl ? "row-reverse" : "row", alignItems: "stretch", gap: "18px" });
    const bar = document.createElement("div"); Object.assign(bar.style, { width: "14px", background: p.accent || "#E8603C", borderRadius: "8px" });
    const col = document.createElement("div"); Object.assign(col.style, { overflow: "hidden", textAlign: rtl ? "right" : "left" });
    const nm = document.createElement("div"); nm.className = rtl ? "ar" : "";
    Object.assign(nm.style, { fontFamily: rtl ? "Taj" : "Mont", fontSize: "92px", color: "#fff", lineHeight: "1.05",
      background: "rgba(10,10,12,.82)", padding: "10px 34px", borderRadius: "16px" });
    nm.textContent = p.name;
    const rl = document.createElement("div"); rl.className = /[؀-ۿ]/.test(p.role || "") ? "ar" : "";
    Object.assign(rl.style, { fontFamily: rl.className ? "TajX" : "Inter", fontSize: "44px", color: "#111", background: p.accent2 || "#FFD400",
      display: "inline-block", padding: "6px 22px", borderRadius: "10px", marginTop: "10px", letterSpacing: rl.className ? "0" : "2px" });
    rl.textContent = p.role || ""; col.appendChild(nm); if (p.role) col.appendChild(rl);
    wrap.appendChild(bar); wrap.appendChild(col);
    const dir = rtl ? 1 : -1;
    const tl = gsap.timeline({ paused: true });
    tl.from(bar, { duration: .3, scaleY: 0, transformOrigin: "top", ease: "power3.out" })
      .from(nm, { duration: .45, xPercent: 110 * dir, ease: "power4.out" }, .12)
      .from(rl, { duration: .4, y: 40, opacity: 0, ease: "back.out(2)" }, .35)
      .to([nm, rl], { duration: .3, xPercent: 110 * dir, opacity: 0, ease: "power3.in" }, D - .35)
      .to(bar, { duration: .25, scaleY: 0, transformOrigin: "bottom", ease: "power3.in" }, D - .25);
    return tl;
  },
  // title drops in, then flags pop one by one at given times (seconds from start)
  flags(p, D) {
    const y = (p.y ?? 0.1) * 1920;
    const box = el("div", "abs glass", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", padding: "26px 50px 34px", textAlign: "center" });
    const tt = document.createElement("div"); tt.className = "ar"; tt.textContent = p.title || "";
    Object.assign(tt.style, { color: "#fff", fontSize: "84px", lineHeight: "1.1", marginBottom: "14px" }); box.appendChild(tt);
    const row = document.createElement("div"); Object.assign(row.style, { display: "flex", gap: "26px", justifyContent: "center", direction: "ltr" });
    box.appendChild(row);
    const fl = (p.flags || []).map(f => { const s = document.createElement("div"); s.textContent = f;
      Object.assign(s.style, { fontSize: "130px", lineHeight: "1", filter: "drop-shadow(0 8px 10px rgba(0,0,0,.5))" }); row.appendChild(s); return s; });
    const tl = gsap.timeline({ paused: true });
    tl.from(box, { duration: .45, y: -80, opacity: 0, ease: "back.out(1.8)" })
      .from(tt, { duration: .35, scale: .6, opacity: 0, ease: "back.out(2.5)" }, .1);
    fl.forEach((f, i) => tl.from(f, { duration: .35, scale: 0, rotation: -25, ease: "back.out(3)" }, (p.times || [])[i] ?? (.4 + i * .25)));
    tl.to(box, { duration: .3, y: -60, opacity: 0, ease: "power2.in" }, D - .3);
    return tl;
  },
  // end card: brand line + pulsing follow button + pointer
  cta(p, D) {
    const y = (p.y ?? 0.62) * 1920;
    const box = el("div", "abs", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", textAlign: "center" });
    const br = document.createElement("div"); br.textContent = p.brand || "";
    Object.assign(br.style, { fontFamily: "Mont", fontSize: "54px", color: "#fff", letterSpacing: "3px",
      textShadow: "0 4px 14px rgba(0,0,0,.7)", marginBottom: "26px", whiteSpace: "nowrap" });
    const bt = document.createElement("div"); bt.className = "ar"; bt.textContent = p.title || "تابعونا";
    Object.assign(bt.style, { display: "inline-block", fontSize: "96px", color: "#111", background: "linear-gradient(180deg,#FFE27A,#F2B52B)",
      padding: "18px 80px 26px", borderRadius: "999px", boxShadow: "0 18px 40px rgba(0,0,0,.5), inset 0 -6px 0 rgba(0,0,0,.18)" });
    const hand = document.createElement("div"); hand.textContent = "👆";
    Object.assign(hand.style, { fontSize: "120px", position: "absolute", right: "-40px", top: "150px" });
    box.appendChild(br); box.appendChild(bt); box.appendChild(hand);
    const tl = gsap.timeline({ paused: true });
    tl.from(br, { duration: .4, y: 30, opacity: 0, ease: "power3.out" })
      .from(bt, { duration: .5, scale: 0, ease: "back.out(2.2)" }, .1)
      .from(hand, { duration: .4, x: 120, y: 120, opacity: 0, ease: "power3.out" }, .45)
      .to(hand, { duration: .14, scale: .82, yoyo: true, repeat: 1 }, .95)
      .to(bt, { duration: .14, scale: .93, yoyo: true, repeat: 1 }, .95)
      .to(bt, { duration: .5, scale: 1.05, yoyo: true, repeat: -1, ease: "sine.inOut" }, 1.3);
    return tl;
  },
  // big kinetic title: lines rise from a mask with gold gradient + shine
  kinetic(p, D) {
    const y = (p.y ?? 0.12) * 1920;
    const box = el("div", "abs", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", textAlign: "center" });
    const lines = (p.lines || []).map((t, i) => { const m = document.createElement("div"); Object.assign(m.style, { overflow: "hidden" });
      const s = document.createElement("div"); s.className = (i % 2 ? "gold" : "") + (/[؀-ۿ]/.test(t) ? " ar" : "");
      s.textContent = t; Object.assign(s.style, { fontFamily: /[؀-ۿ]/.test(t) ? "Taj" : "Mont", fontSize: (p.size || 190) + "px",
        lineHeight: "1.02", color: i % 2 ? "transparent" : "#fff", fontStyle: "italic", letterSpacing: "-3px", whiteSpace: "nowrap",
        textShadow: i % 2 ? "none" : "0 8px 0 rgba(0,0,0,.45)" });
      m.appendChild(s); box.appendChild(m); return s; });
    const tl = gsap.timeline({ paused: true });
    lines.forEach((s, i) => tl.from(s, { duration: .55, yPercent: 110, skewY: 8, ease: "power4.out" }, i * .12));
    tl.to(box, { duration: .3, scale: 1.15, opacity: 0, ease: "power2.in" }, D - .3);
    return tl;
  },
  // contact card: phone icon + number (LTR digits) + small Arabic line, pulsing ring; for a short on-screen window
  contact(p, D) {
    const y = (p.y ?? 0.8) * 1920;
    const box = el("div", "abs glass", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", display: "flex",
                   alignItems: "center", gap: "26px", padding: "22px 46px", direction: "ltr" });
    const ic = document.createElement("div"); ic.textContent = "📞";
    Object.assign(ic.style, { fontSize: "86px", width: "120px", height: "120px", borderRadius: "50%", display: "grid", placeItems: "center",
      background: "linear-gradient(180deg,#3BE37A,#14A44D)", boxShadow: "0 0 0 0 rgba(59,227,122,.6)" });
    const col = document.createElement("div");
    const nb = document.createElement("div"); nb.textContent = p.number || "";
    Object.assign(nb.style, { fontFamily: "Mont", fontSize: "78px", color: "#fff", letterSpacing: "2px", whiteSpace: "nowrap" });
    const ln = document.createElement("div"); ln.className = "ar"; ln.textContent = p.line || "عيطو لينا";
    Object.assign(ln.style, { fontSize: "48px", color: "#FFD400", textAlign: "left" });
    col.appendChild(nb); col.appendChild(ln); box.appendChild(ic); box.appendChild(col);
    const tl = gsap.timeline({ paused: true });
    tl.from(box, { duration: .45, y: 80, opacity: 0, ease: "back.out(1.8)" })
      .from(ic, { duration: .4, scale: 0, rotation: -30, ease: "back.out(3)" }, .15)
      .to(ic, { duration: .9, boxShadow: "0 0 0 34px rgba(59,227,122,0)", repeat: -1, ease: "power1.out" }, .5)
      .to(ic, { duration: .12, rotation: 12, yoyo: true, repeat: 7, ease: "sine.inOut" }, .6)
      .to(box, { duration: .3, y: 60, opacity: 0, ease: "power2.in" }, D - .3);
    return tl;
  },
  // stacked WhatsApp contact cards: [WhatsApp icon][flag][number] per line, each slides in on its own time
  whatsapp_contacts(p, D) {
    const y = (p.y ?? 0.58) * 1920;
    const wa = '<svg viewBox="0 0 64 64" width="104" height="104"><circle cx="32" cy="32" r="30" fill="#25D366"/>' +
      '<path d="M32 13c-10.5 0-19 8.3-19 18.6 0 3.6 1.1 7 3 9.9L13.5 51l9.9-2.9c2.6 1.4 5.6 2.2 8.6 2.2 10.5 0 19-8.3 19-18.6S42.5 13 32 13z" fill="#fff"/>' +
      '<path d="M41.6 37.3c-.5-.3-3-1.5-3.5-1.6-.5-.2-.8-.3-1.1.2-.3.5-1.3 1.6-1.6 1.9-.3.3-.6.4-1.1.1-.5-.3-2.1-.8-4-2.5-1.5-1.3-2.5-2.9-2.8-3.4-.3-.5 0-.8.2-1 .2-.2.5-.6.8-.9.3-.3.3-.5.5-.8.2-.3.1-.6 0-.9-.1-.3-1.1-2.7-1.5-3.6-.4-1-.8-.8-1.1-.8h-.9c-.3 0-.8.1-1.3.6-.4.5-1.7 1.7-1.7 4.1s1.7 4.8 2 5.1c.2.3 3.4 5.2 8.3 7.3 1.2.5 2.1.8 2.8 1 1.2.4 2.2.3 3.1.2.9-.1 3-1.2 3.4-2.4.4-1.2.4-2.2.3-2.4-.1-.2-.4-.3-.9-.6z" fill="#25D366"/></svg>';
    const wrap = el("div", "abs", null, { left: "50%", top: y + "px", transform: "translate(-50%,0)", display: "flex",
                   flexDirection: "column", gap: "26px", alignItems: "stretch" });
    if (p.title) { const t = document.createElement("div"); t.className = "ar"; t.textContent = p.title;
      Object.assign(t.style, { fontSize: "74px", color: "#fff", textAlign: "center", textShadow: "0 6px 18px rgba(0,0,0,.7)" });
      wrap.appendChild(t); }
    const rows = (p.items || []).map(it => {
      const r = document.createElement("div"); r.className = "glass";
      Object.assign(r.style, { display: "flex", alignItems: "center", gap: "22px", padding: "18px 38px 18px 22px", direction: "ltr" });
      const ic = document.createElement("div"); ic.innerHTML = wa; ic.style.lineHeight = "0";
      const fl = document.createElement("div"); fl.textContent = it.flag || "";
      Object.assign(fl.style, { fontSize: "84px", lineHeight: "1" });
      const nb = document.createElement("div"); nb.textContent = it.number || "";
      Object.assign(nb.style, { fontFamily: "Mont", fontSize: "70px", color: "#fff", letterSpacing: "1px", whiteSpace: "nowrap" });
      r.appendChild(ic); r.appendChild(fl); r.appendChild(nb); wrap.appendChild(r); return { r, ic };
    });
    const tl = gsap.timeline({ paused: true });
    if (p.title) tl.from(wrap.firstChild, { duration: .4, y: -30, opacity: 0, ease: "power3.out" }, 0);
    rows.forEach(({ r, ic }, i) => {
      const t0 = (p.times || [])[i] ?? (.15 + i * .35);
      tl.from(r, { duration: .5, x: i % 2 ? 700 : -700, opacity: 0, ease: "power4.out" }, t0)
        .from(ic, { duration: .45, scale: 0, rotation: -40, ease: "back.out(3)" }, t0 + .2)
        .to(ic, { duration: .12, rotation: 10, yoyo: true, repeat: 5, ease: "sine.inOut" }, t0 + .8);
    });
    tl.to(rows.map(o => o.r), { duration: .6, scale: 1.04, yoyo: true, repeat: -1, ease: "sine.inOut", stagger: .3 }, 1.6);
    return tl;
  },
  // full-frame light streak transition (place it so its peak covers a picture change)
  light_wipe(p, D) {
    const g = el("div", "abs", null, { inset: "-20% -60%", background: `linear-gradient(105deg, transparent 35%, ${p.color || "rgba(255,214,120,.0)"} 40%, rgba(255,230,170,.85) 50%, rgba(255,255,255,.95) 52%, rgba(255,214,120,.6) 56%, transparent 64%)` });
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(g, { xPercent: -70 }, { duration: D, xPercent: 70, ease: "power2.inOut" });
    return tl;
  },
};

window.build = (name, params, duration) => { S().innerHTML = ""; window.tl = T[name](params || {}, duration); return true; };
window.seek = (t) => { window.tl.time(t, false); return true; };
</script></body></html>
